<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>商厨设备 · 智能线索管理</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --p:#1a56db;--pl:#e8f0fe;--s:#059669;--sl:#ecfdf5;--w:#d97706;--wl:#fffbeb;--d:#dc2626;--dl:#fef2f2;
  --bg:#f1f5f9;--card:#fff;--bd:#e2e8f0;--t:#1e293b;--ts:#64748b;--tm:#94a3b8;
  --r:10px;--rs:6px;--rx:4px;--sh:0 1px 3px rgba(0,0,0,.08);--shm:0 4px 12px rgba(0,0,0,.08);
}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--t);min-height:100vh}
/* LOGIN */
.login-page{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.login-card{background:var(--card);border-radius:var(--r);box-shadow:var(--shm);padding:40px 32px;width:100%;max-width:380px}
.login-card h1{font-size:22px;text-align:center;margin-bottom:4px}
.login-card .sub{font-size:13px;color:var(--ts);text-align:center;margin-bottom:28px}
.login-card input{width:100%;padding:10px 14px;border:1px solid var(--bd);border-radius:var(--rs);font-size:14px;margin-bottom:14px;outline:none;font-family:inherit}
.login-card input:focus{border-color:var(--p);box-shadow:0 0 0 3px rgba(26,86,219,.12)}
.login-card .btn{width:100%;padding:11px;font-size:15px;font-weight:600}
.login-card .tip{font-size:11px;color:var(--tm);text-align:center;margin-top:16px;line-height:1.6}
/* APP */
.app{display:none}
.app.active,.login-page.hidden{display:block}
.login-page.hidden{display:none}
/* HEADER */
.header{background:var(--card);border-bottom:1px solid var(--bd);padding:0 20px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.header h1{font-size:16px;font-weight:700}
.header-right{display:flex;align-items:center;gap:12px}
.notify-btn{position:relative;background:none;border:none;font-size:20px;cursor:pointer;padding:4px 8px;border-radius:var(--rx)}
.notify-btn:hover{background:var(--bg)}
.notify-dot{position:absolute;top:2px;right:2px;width:9px;height:9px;background:var(--d);border-radius:50%;border:2px solid #fff;display:none}
.notify-dot.show{display:block}
.user-chip{font-size:13px;color:var(--ts);display:flex;align-items:center;gap:6px}
/* TABS */
.tabs{display:flex;background:var(--card);border-bottom:1px solid var(--bd);overflow-x:auto;-webkit-overflow-scrolling:touch}
.tab{padding:12px 18px;font-size:13px;font-weight:500;color:var(--ts);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;transition:.15s;background:none;border-top:none;border-left:none;border-right:none;flex-shrink:0;font-family:inherit}
.tab:hover{color:var(--t)}
.tab.active{color:var(--p);border-bottom-color:var(--p);font-weight:600}
/* CONTENT */
.content{padding:16px;max-width:1100px;margin:0 auto}
.page{display:none}
.page.active{display:block}
/* Stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--card);border-radius:var(--rs);padding:14px;box-shadow:var(--sh);text-align:center}
.stat-num{font-size:24px;font-weight:700}
.stat-label{font-size:11px;color:var(--ts);margin-top:2px}
.stat.red .stat-num{color:var(--d)}
.stat.green .stat-num{color:var(--s)}
.stat.blue .stat-num{color:var(--p)}
/* Card */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:14px;overflow:hidden}
.card-hd{padding:12px 16px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.card-hd h3{font-size:14px;font-weight:600}
.card-bd{padding:0}
/* Toolbar */
.toolbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.toolbar select,.toolbar input{padding:6px 10px;border:1px solid var(--bd);border-radius:var(--rx);font-size:12px;color:var(--t);background:#fff;outline:none;font-family:inherit}
.toolbar input{width:140px}
/* Buttons */
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:var(--rx);font-size:13px;font-weight:500;cursor:pointer;border:1px solid transparent;transition:.15s;font-family:inherit;white-space:nowrap;text-decoration:none}
.btn-p{background:var(--p);color:#fff}.btn-p:hover{background:#1a40b0}
.btn-o{background:#fff;color:var(--t);border-color:var(--bd)}.btn-o:hover{background:var(--bg)}
.btn-s{background:var(--s);color:#fff}.btn-s:hover{background:#047857}
.btn-d{border-color:#fecaca;color:var(--d)}.btn-d:hover{background:var(--dl)}
.btn-sm{padding:4px 10px;font-size:11px}
.btn-blk{display:block;width:100%;text-align:center;justify-content:center}
/* Table */
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;min-width:600px}
th{text-align:left;padding:9px 12px;font-size:11px;font-weight:600;color:var(--ts);background:var(--bg);border-bottom:1px solid var(--bd);white-space:nowrap}
td{padding:10px 12px;font-size:12px;border-bottom:1px solid var(--bd);vertical-align:middle}
tr:hover{background:#f8fafc}
.warn-row{background:var(--wl)!important}
.danger-row{background:var(--dl)!important}
/* Badges */
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600}
.badge-a{background:#fee2e2;color:#991b1b}
.badge-b{background:#fef3c7;color:#92400e}
.badge-c{background:#dbeafe;color:#1e40af}
.status{display:inline-block;padding:3px 10px;border-radius:10px;font-size:11px;font-weight:600}
.status-新线索{background:#dbeafe;color:#1e40af}
.status-已联系{background:#fef3c7;color:#92400e}
.status-沟通中{background:#ede9fe;color:#6b21a8}
.status-报价中{background:#cffafe;color:#155e75}
.status-已成交{background:#d1fae5;color:#065f46}
.status-已丢单{background:#fee2e2;color:#991b1b}
/* Lead card (mobile) */
.lead-card{display:none;padding:14px;border-bottom:1px solid var(--bd)}
.lead-card:last-child{border-bottom:none}
.lead-card .lc-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.lead-card .lc-name{font-size:14px;font-weight:600}
.lead-card .lc-info{font-size:12px;color:var(--ts)}
.lead-card .lc-actions{margin-top:8px;display:flex;gap:4px;flex-wrap:wrap}
@media(max-width:768px){
  .table-wrap table{display:none}
  .lead-card{display:block}
  .stats{grid-template-columns:repeat(2,1fr)}
  .tabs{gap:0}.tab{padding:12px 12px;font-size:12px}
  .content{padding:12px}
  .header{padding:0 12px}
  .toolbar input{width:110px}
}
/* MODAL */
.modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);z-index:100;align-items:center;justify-content:center;padding:16px}
.modal.show{display:flex}
.modal-inner{background:var(--card);border-radius:var(--r);width:100%;max-width:500px;max-height:85vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal-hd{padding:14px 18px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.modal-hd h3{font-size:15px}
.modal-close{background:none;border:none;font-size:22px;cursor:pointer;color:var(--tm);padding:2px 6px;border-radius:var(--rx)}
.modal-bd{padding:16px 18px;flex:1;overflow-y:auto}
.modal-ft{padding:12px 18px;border-top:1px solid var(--bd);display:flex;gap:8px;justify-content:flex-end;flex-shrink:0}
/* FORM */
.fg{margin-bottom:14px}
.fg label{display:block;font-size:12px;font-weight:600;color:var(--t);margin-bottom:4px}
.fg input,.fg select,.fg textarea{width:100%;padding:8px 12px;border:1px solid var(--bd);border-radius:var(--rs);font-size:13px;outline:none;font-family:inherit}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--p);box-shadow:0 0 0 3px rgba(26,86,219,.1)}
.fg textarea{resize:vertical;min-height:60px}
.fg-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
/* Grade tags */
.grade-tags{display:flex;gap:8px}
.grade-tag{padding:6px 16px;border:2px solid var(--bd);border-radius:var(--rs);cursor:pointer;font-size:13px;font-weight:600;transition:.15s;text-align:center;flex:1}
.grade-tag:hover{border-color:var(--p)}
.grade-tag.sel-a{border-color:#ef4444;background:#fef2f2;color:#991b1b}
.grade-tag.sel-b{border-color:#f59e0b;background:#fffbeb;color:#92400e}
.grade-tag.sel-c{border-color:#3b82f6;background:#eff6ff;color:#1e40af}
/* Checkbox pills */
.check-pills{display:flex;flex-wrap:wrap;gap:8px}
.check-pill{display:flex;align-items:center;gap:6px;padding:6px 12px;border:1px solid var(--bd);border-radius:20px;cursor:pointer;font-size:12px;transition:.15s;user-select:none}
.check-pill:hover{border-color:var(--p)}
.check-pill.checked{background:var(--sl);border-color:var(--s);color:var(--s);font-weight:500}
.check-pill input{display:none}
/* Notification toast */
.toast{position:fixed;top:16px;right:16px;z-index:200;max-width:360px}
.toast-item{background:var(--card);border-radius:var(--rs);box-shadow:0 8px 30px rgba(0,0,0,.15);padding:14px 16px;margin-bottom:8px;animation:slideIn .3s ease;display:flex;gap:10px;align-items:flex-start;font-size:13px;border-left:3px solid var(--p)}
.toast-item.reminder{border-left-color:var(--w)}
.toast-item .toast-msg{flex:1;line-height:1.5}
.toast-item .toast-close{background:none;border:none;cursor:pointer;color:var(--tm);font-size:16px;padding:0 4px}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
/* Notification panel */
.notify-panel{position:fixed;top:56px;right:0;width:340px;max-width:100vw;max-height:70vh;background:var(--card);box-shadow:0 8px 30px rgba(0,0,0,.15);border-radius:0 0 var(--r) var(--r);z-index:150;overflow-y:auto;display:none}
.notify-panel.show{display:block}
.notify-panel .np-item{padding:12px 16px;border-bottom:1px solid var(--bd);font-size:12px;cursor:pointer;line-height:1.5}
.notify-panel .np-item:hover{background:var(--bg)}
.notify-panel .np-item.unread{background:var(--pl)}
.notify-panel .np-time{font-size:10px;color:var(--tm);margin-top:4px}
/* Empty */
.empty{padding:40px 20px;text-align:center;color:var(--tm);font-size:13px}
/* Funnel */
.funnel{padding:16px}
.funnel-row{display:flex;align-items:center;margin-bottom:8px}
.funnel-label{width:70px;font-size:12px;color:var(--ts);text-align:right;padding-right:10px;flex-shrink:0}
.funnel-bar-wrap{flex:1;height:30px;background:var(--bg);border-radius:4px;overflow:hidden}
.funnel-bar{height:100%;border-radius:4px;display:flex;align-items:center;padding:0 10px;transition:width .6s}
.funnel-bar span{font-size:12px;color:#fff;font-weight:600}
/* Score display */
.score-bar{display:flex;align-items:center;gap:6px}
.score-dot{width:10px;height:10px;border-radius:50%}
.score-dot.on{background:var(--s)}
.score-dot.off{background:var(--bd)}
/* AI Analysis */
.analyze-header{display:flex;align-items:center;gap:12px;margin-bottom:16px;padding:14px;background:linear-gradient(135deg,#f0f4ff,#e8f0fe);border-radius:var(--rs)}
.analyze-header .ah-score{font-size:36px;font-weight:800;color:var(--p)}
.analyze-header .ah-label{font-size:12px;color:var(--ts)}
.analyze-meters{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:16px}
.analyze-meter{background:var(--bg);border-radius:var(--rs);padding:12px;text-align:center}
.analyze-meter .am-val{font-size:22px;font-weight:700}
.analyze-meter .am-label{font-size:11px;color:var(--ts);margin-top:2px}
.analyze-section{margin-bottom:16px}
.analyze-section h4{font-size:13px;font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.analyze-gap{display:flex;align-items:flex-start;gap:8px;padding:8px 10px;margin-bottom:6px;background:var(--wl);border-radius:var(--rx);font-size:12px;border-left:3px solid var(--w)}
.analyze-rec{display:flex;align-items:flex-start;gap:8px;padding:10px 12px;margin-bottom:6px;border-radius:var(--rx);font-size:12px;line-height:1.5}
.analyze-rec.urgent{background:var(--dl);border-left:3px solid var(--d)}
.analyze-rec.info{background:var(--pl);border-left:3px solid var(--p)}
.analyze-rec.strategy{background:var(--sl);border-left:3px solid var(--s)}
.analyze-rec.warning{background:var(--wl);border-left:3px solid var(--w)}
.analyze-rec.maintain{background:#f0f4ff;border-left:3px solid #6366f1}
.analyze-rec.reactivate{background:#fdf4ff;border-left:3px solid #a855f7}
.analyze-timeline{font-size:12px;color:var(--ts);line-height:1.6;padding:10px 12px;background:var(--bg);border-radius:var(--rx)}
</style>
</head>
<body>

<!-- ====== LOGIN ====== -->
<div class="login-page" id="loginPage">
  <div class="login-card">
    <h1>🔧 商厨智能线索管理</h1>
    <div class="sub">多角色协同 · 实时通知 · 手机可用</div>
    <input type="text" id="loginUser" placeholder="账号" autocomplete="username">
    <input type="password" id="loginPass" placeholder="密码" autocomplete="current-password">
    <button class="btn btn-p" onclick="doLogin()">登 录</button>
    <div class="tip">
      演示账号：<br>
      管理员 admin / admin123<br>
      运营 yunying / ops123<br>
      业务 zhangwei / 123456<br>
      业务 liming / 123456
    </div>
  </div>
</div>

<!-- ====== MAIN APP ====== -->
<div class="app" id="appMain">
  <div class="header">
    <h1 id="headerTitle">线索管理</h1>
    <div class="header-right">
      <button class="notify-btn" onclick="toggleNotifications()" title="消息通知">🔔<span class="notify-dot" id="notifyDot"></span></button>
      <span class="user-chip" id="userChip"></span>
      <button class="btn btn-o btn-sm" onclick="doLogout()">退出</button>
    </div>
  </div>

  <div class="tabs" id="tabsBar"></div>

  <div class="content" id="appContent"></div>
</div>

<!-- ====== TOAST CONTAINER ====== -->
<div class="toast" id="toastContainer"></div>

<!-- ====== NOTIFICATION PANEL ====== -->
<div class="notify-panel" id="notifyPanel"></div>

<!-- ====== MODALS ====== -->
<div class="modal" id="leadModal">
  <div class="modal-inner">
    <div class="modal-hd"><h3 id="lmTitle">新增线索</h3><button class="modal-close" onclick="closeM('leadModal')">&times;</button></div>
    <div class="modal-bd">
      <div class="fg-row">
        <div class="fg"><label>客户姓名 *</label><input id="lmName" placeholder="如：张总"></div>
        <div class="fg"><label>电话 *</label><input id="lmPhone" type="tel" placeholder="手机号"></div>
      </div>
      <div class="fg-row">
        <div class="fg"><label>公司/单位 *</label><input id="lmCompany" placeholder="如：XX大酒店"></div>
        <div class="fg"><label>线索来源</label><select id="lmSource"><option>抖音</option><option>快手</option><option>视频号</option><option>小红书</option><option>展会</option><option>老客户介绍</option><option>其他</option></select></div>
      </div>
      <div class="fg-row">
        <div class="fg"><label>意向产品</label><input id="lmProduct" placeholder="如：商用电磁炉、自动炒菜机"></div>
        <div class="fg"><label>分配给业务员</label><select id="lmAssign"></select></div>
      </div>
      <div class="fg"><label>客户意向等级</label>
        <div class="grade-tags">
          <div class="grade-tag sel-a" onclick="setGrade('A')">🔥 A级 · 高意向</div>
          <div class="grade-tag" onclick="setGrade('B')">👍 B级 · 中意向</div>
          <div class="grade-tag" onclick="setGrade('C')">👀 C级 · 低意向</div>
        </div>
      </div>
      <div class="fg"><label>备注</label><textarea id="lmNote" rows="2" placeholder="记录客户关键信息..."></textarea></div>
    </div>
    <div class="modal-ft">
      <button class="btn btn-o" onclick="closeM('leadModal')">取消</button>
      <button class="btn btn-p" onclick="saveLead()">💾 保存并分配</button>
    </div>
  </div>
</div>

<!-- Follow-up Modal -->
<div class="modal" id="followModal">
  <div class="modal-inner">
    <div class="modal-hd"><h3>📝 跟进记录</h3><button class="modal-close" onclick="closeM('followModal')">&times;</button></div>
    <div class="modal-bd" id="followBody"></div>
    <div class="modal-ft">
      <button class="btn btn-o" onclick="closeM('followModal')">取消</button>
      <button class="btn btn-p" onclick="saveFollowup()">💾 保存跟进记录</button>
    </div>
  </div>
</div>

<!-- Detail Modal -->
<div class="modal" id="detailModal">
  <div class="modal-inner" style="max-width:600px">
    <div class="modal-hd"><h3>📋 线索详情</h3><button class="modal-close" onclick="closeM('detailModal')">&times;</button></div>
    <div class="modal-bd" id="detailBody"></div>
    <div class="modal-ft">
      <button class="btn btn-o" onclick="closeM('detailModal')">关闭</button>
      <button class="btn btn-p btn-sm" onclick="openFollowup(currentDetailLeadId)">📝 跟进</button>
      <button class="btn" style="background:#7c3aed;color:#fff" onclick="analyzeLead(currentDetailLeadId)">🤖 AI分析</button>
    </div>
  </div>
</div>

<!-- User Modal -->
<div class="modal" id="userModal">
  <div class="modal-inner">
    <div class="modal-hd"><h3 id="umTitle">添加用户</h3><button class="modal-close" onclick="closeM('userModal')">&times;</button></div>
    <div class="modal-bd" id="userBody"></div>
    <div class="modal-ft">
      <button class="btn btn-o" onclick="closeM('userModal')">取消</button>
      <button class="btn btn-p" onclick="saveUser()">保存</button>
    </div>
  </div>
</div>

<!-- AI Analysis Modal -->
<div class="modal" id="analyzeModal">
  <div class="modal-inner" style="max-width:640px">
    <div class="modal-hd"><h3>🤖 AI 智能分析报告</h3><button class="modal-close" onclick="closeM('analyzeModal')">&times;</button></div>
    <div class="modal-bd" id="analyzeBody">
      <div style="text-align:center;padding:40px;color:var(--tm)">分析中...</div>
    </div>
  </div>
</div>

<script>
// ===== GLOBAL STATE =====
let me = null;
let token = '';
let WS = null;
let selectedGrade = 'B';
let notifyAudio = null;
let currentDetailLeadId = '';

// ===== API =====
async function api(method, url, body) {
  const opts = { method, headers: { 'Content-Type': 'application/json', 'Authorization': token } };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(url, opts);
  if (res.status === 401) { doLogout(); throw new Error('登录过期'); }
  return res.json();
}

// ===== LOGIN =====
async function doLogin() {
  const username = document.getElementById('loginUser').value.trim();
  const password = document.getElementById('loginPass').value.trim();
  if (!username || !password) return alert('请输入账号和密码');
  try {
    const data = await fetch('/api/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    }).then(r => r.json());
    if (data.error) return alert(data.error);
    me = data.user;
    token = data.token;
    document.getElementById('loginPage').classList.add('hidden');
    document.getElementById('appMain').classList.add('active');
    connectWS();
    renderApp();
    loadNotificationSound();
  } catch (e) { alert('登录失败: ' + e.message); }
}

function doLogout() {
  if (WS) WS.close();
  me = null; token = '';
  document.getElementById('loginPage').classList.remove('hidden');
  document.getElementById('appMain').classList.remove('active');
}

// ===== WEBSOCKET =====
function connectWS() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  WS = new WebSocket(`${proto}//${location.host}`);
  WS.onopen = () => { WS.send(JSON.stringify({ type: 'auth', userId: me.id })); };
  WS.onmessage = (e) => {
    try {
      const data = JSON.parse(e.data);
      if (data.type === 'new_lead_assigned' || data.type === 'reminder') {
        showToast(data.notification || data);
        if (notifyAudio) { notifyAudio.currentTime = 0; notifyAudio.play().catch(() => {}); }
        if (currentPage === 'leads') loadLeads();
      }
      if (data.unreadCount !== undefined) {
        updateNotifyBadge(data.unreadCount);
      }
    } catch (ex) {}
  };
  WS.onclose = () => { setTimeout(connectWS, 5000); };
}

function loadNotificationSound() {

async function toggleNotifications() {
  const panel = document.getElementById('notifyPanel');
  if (panel.classList.contains('show')) { panel.classList.remove('show'); return; }
  const data = await api('GET', '/api/notifications');
  panel.innerHTML = data.list.length === 0
    ? '<div class="empty">暂无消息</div>'
    : `<div style="padding:8px 16px;text-align:right"><button class="btn btn-o btn-sm" onclick="markAllRead()">全部已读</button></div>` +
      data.list.map(n => `
        <div class="np-item ${n.is_read ? '' : 'unread'}" onclick="markRead('${n.id}')">
          ${n.message}
          <div class="np-time">${new Date(n.created_at).toLocaleString('zh-CN')}</div>
        </div>
      `).join('');
  panel.classList.add('show');
  updateNotifyBadge(data.unread);
  document.addEventListener('click', closeNotifyOnClickOutside);
}

function closeNotifyOnClickOutside(e) {
  const panel = document.getElementById('notifyPanel');
  const btn = document.querySelector('.notify-btn');
  if (!panel.contains(e.target) && e.target !== btn && !btn.contains(e.target)) {
    panel.classList.remove('show');
    document.removeEventListener('click', closeNotifyOnClickOutside);
  }
}

async function markRead(id) {
  await api('PUT', `/api/notifications/${id}/read`);
  toggleNotifications();
}

async function markAllRead() {
  await api('PUT', '/api/notifications/read-all');
  toggleNotifications();
}

function updateNotifyBadge(count) {
  const dot = document.getElementById('notifyDot');

}

function buildLeadTable(leads) {
  if (leads.length === 0) return '<div class="empty">暂无数据</div>';

  // Desktop table

  if (me.role !== 'sales') html += '<th>客户</th><th>公司</th><th>产品</th><th>业务员</th>';
  else html += '<th>客户</th><th>公司</th><th>产品</th>';
  html += '<th>电话</th><th>等级</th><th>状态</th><th>跟进</th><th>操作</th></tr></thead><tbody>';

  leads.forEach(l => {
    const overdue = isLeadOverdue(l);
    const rowClass = overdue === 'danger' ? 'danger-row' : overdue === 'warning' ? 'warn-row' : '';
    html += `<tr class="${rowClass}">`;
    if (me.role !== 'sales') {
      html += `<td><strong>${esc(l.name)}</strong></td><td>${esc(l.company)}</td><td style="font-size:11px">${esc(l.product_interest||'—')}</td><td>${esc(l.assigned_to||'未分配')}</td>`;
    } else {
      html += `<td><strong>${esc(l.name)}</strong></td><td>${esc(l.company)}</td><td style="font-size:11px">${esc(l.product_interest||'—')}</td>`;
    }
    html += `<td style="font-family:monospace;font-size:12px;color:${l._phone_masked?'var(--tm)':'var(--p)'};font-weight:${l._phone_masked?'400':'600'}">${esc(l.phone)}</td>`;
    html += `<td><span class="badge badge-${l.grade.toLowerCase()}">${l.grade}级</span></td>`;
    html += `<td><span class="status status-${l.status}">${l.status}</span></td>`;
    html += `<td style="font-size:11px;color:${overdue!=='none'?'var(--d)':'var(--ts)'}">${overdue!=='none'?'⚠️ ':''}${formatDt(l.updated_at)}</td>`;
    html += `<td style="display:flex;gap:4px;flex-wrap:wrap">
      <button class="btn btn-o btn-sm" onclick="openDetail('${l.id}')">详情</button>
      <button class="btn btn-p btn-sm" onclick="openFollowup('${l.id}')">📝跟进</button>
      <button class="btn btn-sm" style="background:#7c3aed;color:#fff" onclick="analyzeLead('${l.id}')">🤖AI分析</button>
      <button class="btn btn-sm" style="background:#0ea5e9;color:#fff" onclick="generateScript('${l.id}')">📞AI话术</button>
      ${l.assigned_to ? `<button class="btn btn-sm" style="background:#f97316;color:#fff" onclick="releaseLead('${l.id}')" title="释放到公海池">🌊</button>` : ''}
      ${me.role==='admin'?`<button class="btn btn-d btn-sm" onclick="delLead('${l.id}')">✕</button>`:''}
    </td>`;
    html += '</tr>';
  });
  html += '</tbody></table></div>';

  // Mobile cards
  leads.forEach(l => {
    const overdue = isLeadOverdue(l);
    html += `<div class="lead-card" style="background:${overdue==='danger'?'#fef2f2':overdue==='warning'?'#fffbeb':'#fff'}">
      <div class="lc-row"><span class="lc-name">${esc(l.name)}</span><span class="badge badge-${l.grade.toLowerCase()}">${l.grade}级</span></div>
      <div class="lc-row"><span class="lc-info">${esc(l.company)}</span><span class="status status-${l.status}">${l.status}</span></div>
      <div class="lc-info">📦 ${esc(l.product_interest||'未指定')} ${me.role!=='sales'? '| 👤 '+esc(l.assigned_to||'未分配') :''}</div>
      <div class="lc-info" style="color:${overdue!=='none'?'var(--d)':'var(--ts)'}">🕐 ${overdue!=='none'?'⚠️ ':''}${formatDt(l.updated_at)}</div>
      <div class="lc-actions">
        <button class="btn btn-o btn-sm" onclick="openDetail('${l.id}')">详情</button>
        <button class="btn btn-p btn-sm" onclick="openFollowup('${l.id}')">📝跟进</button>
        <button class="btn btn-sm" style="background:#7c3aed;color:#fff" onclick="analyzeLead('${l.id}')">🤖AI分析</button>
        ${me.role==='admin'?`<button class="btn btn-d btn-sm" onclick="delLead('${l.id}')">删除</button>`:''}
      </div>
    </div>`;
  });

  return html;
}

function isLeadOverdue(lead) {
  if (lead.status === '已成交' || lead.status === '已丢单') return 'none';
  const now = new Date();
  const updated = new Date(lead.updated_at);
  const diff = (now - updated) / 3600000;

  if (lead.grade === 'A' && diff > 4) return 'danger';
  if (lead.grade === 'B' && diff > 24) return 'danger';
  if (lead.grade === 'C' && diff > 72) return 'warning';
  if (diff > 24) return 'warning';
  return 'none';
}

        <div class="funnel-row">
          <div class="funnel-label">${s}</div>
          <div class="funnel-bar-wrap">
            <div class="funnel-bar" style="width:${Math.max(counts[i]/maxCount*100,5)}%;background:${colors[i]}">

async function doTransfer() {
  const fromUser = document.getElementById('transferFrom').value;
  const toUser = document.getElementById('transferTo').value;
  const mode = document.getElementById('transferMode').value;
  if (fromUser === toUser) return alert('转出来源和目标不能相同');

  let leadIds = null;
  if (mode === 'active') {
    // Get active leads from fromUser
    const all = await api('GET', '/api/leads?assigned=' + encodeURIComponent(fromUser));
    leadIds = all.filter(l => l.status !== '已成交' && l.status !== '已丢单').map(l => l.id);
    if (leadIds.length === 0) return alert(`${fromUser}名下没有未成交客户可转移`);
  }

  const count = leadIds ? `${leadIds.length}条（仅未成交）` : '全部';
  if (!confirm(`确认将 ${fromUser} 名下的 ${count} 客户转移到 ${toUser}？\n\n此操作不可撤销！`)) return;

  const result = await api('POST', '/api/leads/transfer', { fromUser, toUser, leadIds });
  if (result.error) return alert('❌ ' + result.error);
  alert('✅ ' + result.message);
  loadUsers();
}

async function toggleLock(userId, currentlyLocked) {
  const action = currentlyLocked ? '解锁' : '锁定';
  if (!confirm(`确认${action}此账号？${!currentlyLocked ? '锁定后该业务员将无法领取公海线索' : ''}`)) return;
  const result = await api('POST', `/api/users/${userId}/lock`, { locked: !currentlyLocked });
  if (result.error) return alert('❌ ' + result.error);
  alert('✅ ' + result.message);
  loadUsers();
}

async function saveUser() {
  const editId = document.getElementById('umEditId').value;
  const username = document.getElementById('umUsername').value.trim();
  const displayName = document.getElementById('umDisplayName').value.trim();
  const role = document.getElementById('umRole').value;
  const phone = document.getElementById('umPhone').value.trim();
  const password = document.getElementById('umPassword').value.trim();

  if (!username || !displayName) return alert('请填写必填项');

  let result;
  if (editId) {
    const body = { username, display_name: displayName, role, phone };
    if (password) body.password = password;
    result = await api('PUT', '/api/users/' + editId, body);
  } else {
    if (!password) return alert('请设置密码');
    result = await api('POST', '/api/users', { username, password, display_name: displayName, role, phone });
  }

  if (result.error) return alert(result.error);
  closeM('userModal');
  loadUsers();
}

async function exportDuplicates() {
  const data = await api('GET', '/api/duplicates');
  let csv = '类型,重复值,客户姓名,公司,电话,业务员,状态,录入时间\n';
  data.byPhone.concat(data.byCompany).forEach(g => {
    g.leads.forEach(l => {
      csv += `${g.type},${g.value},${l.name},${l.company},${l.phone},${l.assigned_to},${l.status},${l.created_at}\n`;
    });
  });
  // Download CSV
  const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `重复客户_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

async function setTarget() {
  const userId = document.getElementById('tgUser').value;

    userId,
    year: now.getFullYear(),
    month: now.getMonth() + 1,
    target
  });
  alert('✅ 目标已设定');
  loadResultPerf();
}

async function applyAiSuggest(key, value) {
  const config = await api('GET', '/api/reminder-config');
  const item = config.find(c => c.rule_key === key);
  if (item) {
    await api('PUT', '/api/reminder-config/' + item.id, { value: String(value) });
    alert('✅ 已应用AI建议');
    aiOptimizeReminders();
  }
}
